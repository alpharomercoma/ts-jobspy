name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; the publish job re-declares the id-token it needs.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test, Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check docs for em/en dashes
        run: npm run lint:docs

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never cache in a release build

      # Pinned: this job holds id-token: write, so nothing unpinned may run in it.
      # npm >= 11.5.1 is required for trusted publishing (OIDC).
      - name: Install pinned npm for trusted publishing (OIDC)
        run: npm install -g npm@12.0.2

      - name: Check whether this version is already published
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          # Fail closed: only a confirmed 404 means "not published". A registry
          # outage, DNS failure, or auth error must not be mistaken for a new version.
          if OUT=$(npm view "$NAME@$VERSION" version 2>&1); then
            echo "Version $VERSION already on npm; skipping publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -q "E404"; then
            echo "Version $VERSION not yet published."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "$OUT"
            echo "npm view failed for a reason other than 404; refusing to decide about publishing."
            exit 1
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build

      - name: Publish to npm (trusted publishing via OIDC)
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
