name: Scrape Health

on:
  schedule:
    # Daily at 06:17 UTC (off the busy top-of-hour cron slots)
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  probe:
    name: Probe job boards for drift
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run scrape-health probe
        run: node scripts/scrape-health.mjs --json scrape-health-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrape-health-${{ github.run_id }}
          path: scrape-health-report.json
          retention-days: 90
